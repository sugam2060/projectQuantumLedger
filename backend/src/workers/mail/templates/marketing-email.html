<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{headline}}</title>
  </head>
  <body>
    <main>
      <h1>{{headline}}</h1>
      <p>{{body}}</p>
      {{#if ctaUrl}}
      <p><a href="{{ctaUrl}}">{{ctaText}}</a></p>
      {{/if}} {{#if unsubscribeUrl}}
      <p><a href="{{unsubscribeUrl}}">Unsubscribe</a></p>
      {{/if}}
    </main>
  </body>
</html>
