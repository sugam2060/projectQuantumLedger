name: Continuous Integration

on:
  pull_request:
    branches: [ "**" ]
  push:
    branches: [ main ]

jobs:
  # Security scanning
  security:
    name: 🔒 Security Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level high

      - name: Run secret scanning
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified

  # Code quality checks
  code-quality:
    name: 🧹 Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Check formatting
        run: npm run format -- --check

      - name: Run type checking
        run: npx tsc --noEmit

  # Dependency auditing
  dependency-audit:
    name: 📦 Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit

  # Unit tests with coverage
  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:cov

  # Integration tests with databases
  integration-tests:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_secret_at_least_32_characters_long_for_testing_purposes_only

      - name: Run integration tests
        run: npm run test
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_secret_at_least_32_characters_long_for_testing_purposes_only

  # E2E tests
  e2e-tests:
    name: 🌐 E2E Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: e2e_user
          POSTGRES_PASSWORD: e2e_password
          POSTGRES_DB: e2e_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://e2e_user:e2e_password@localhost:5432/e2e_db
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_secret_at_least_32_characters_long_for_testing_purposes_only

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://e2e_user:e2e_password@localhost:5432/e2e_db
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_secret_at_least_32_characters_long_for_testing_purposes_only

  # Matrix testing across Node.js versions
  matrix-testing:
    name: ⚙️ Matrix Testing
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test

  # Build verification
  build-verification:
    name: 🏗️ Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run production build
        run: npm run build

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: dist
          key: ${{ runner.os }}-build-${{ hashFiles('**/*.ts') }}

  # Static Application Security Testing (SAST)
  sast:
    name: 🛡️ SAST Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # Pull Request automation
  pr-automation:
    name: 🤖 PR Automation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [security, code-quality, dependency-audit, unit-tests, integration-tests, e2e-tests, matrix-testing, build-verification]
    steps:
      - name: Add PR labels
        uses: actions/github-script@v7
        with:
          script: |
            const statuses = ${{ toJSON(needs) }};
            const labels = [];

            // Check if all jobs passed
            const allPassed = Object.values(statuses).every(job => job.result === 'success');

            if (allPassed) {
              labels.push('status: ready-to-merge');
            } else {
              labels.push('status: needs-work');
            }

            // Add labels based on job results
            Object.entries(statuses).forEach(([job, result]) => {
              if (result.result !== 'success') {
                labels.push(`failed: ${job}`);
              }
            });

            github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: labels
            });

      - name: Comment on PR with status
        uses: actions/github-script@v7
        with:
          script: |
            const statuses = ${{ toJSON(needs) }};
            let comment = "## 🚀 CI Pipeline Results\n\n";

            comment += "| Job | Status |\n";
            comment += "|-----|--------|\n";

            Object.entries(statuses).forEach(([job, result]) => {
              const statusEmoji = result.result === 'success' ? '✅' : '❌';
              comment += `| ${job} | ${statusEmoji} ${result.result} |\n`;
            });

            comment += "\n<details>\n<summary>Details</summary>\n\n";
            comment += "All checks have completed. Review the results above.\n";
            comment += "</details>";

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });