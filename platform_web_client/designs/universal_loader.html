  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: "Instrument Sans", sans-serif;
    }

    /* Universal Fortis Loader: scales any element via --loader-size */
    .fortis-loader {
      --loader-size: 64px;
      --blade-primary: #111D25;
      --blade-accent: #496D59;
      --loader-text: #43474B;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: calc(var(--loader-size) * 0.22);
      user-select: none;
    }

    .fortis-loader[data-surface="dark"] {
      --blade-primary: #F2F5F3;
      --blade-accent: #7FB596;
      --loader-text: rgba(242, 245, 243, 0.78);
    }

    .fortis-loader__mark {
      width: var(--loader-size);
      height: var(--loader-size);
      display: block;
      overflow: visible;
    }

    .fortis-loader__blade {
      transform-box: fill-box;
      transform-origin: center;
      animation: fortis-blade-pulse 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .fortis-loader__blade--1 { animation-delay: 0ms; }
    .fortis-loader__blade--2 { animation-delay: 220ms; }
    .fortis-loader__blade--3 { animation-delay: 440ms; }

    @keyframes fortis-blade-pulse {
      0%, 100% {
        opacity: 0.35;
        transform: translateY(0);
      }
      50% {
        opacity: 1;
        transform: translateY(-4px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .fortis-loader__blade {
        animation: none;
        opacity: 1;
      }
    }
  </style>
</head>
<body class="bg-transparent">
  <div class="w-full bg-light-surface-container-lowest border border-light-outline-variant rounded-lg p-gutter-lg flex flex-col gap-gutter-md">
    <!-- Controls -->
    <div class="flex flex-wrap items-center justify-between gap-gutter-sm pb-gutter-sm border-b border-light-outline-variant">
      <div class="inline-flex items-center gap-1 rounded bg-light-surface-container-low p-1 border border-light-outline-variant" role="group" aria-label="Size presets">
        <button type="button" data-size="24" class="size-preset px-2 py-1 rounded font-mono text-mono-sm text-light-on-surface-variant hover:text-light-on-surface cursor-pointer">24px</button>
        <button type="button" data-size="40" class="size-preset px-2 py-1 rounded font-mono text-mono-sm text-light-on-surface-variant hover:text-light-on-surface cursor-pointer">40px</button>
        <button type="button" data-size="64" class="size-preset px-2 py-1 rounded font-mono text-mono-sm bg-light-primary text-light-on-primary cursor-pointer">64px</button>
        <button type="button" data-size="96" class="size-preset px-2 py-1 rounded font-mono text-mono-sm text-light-on-surface-variant hover:text-light-on-surface cursor-pointer">96px</button>
        <button type="button" data-size="128" class="size-preset px-2 py-1 rounded font-mono text-mono-sm text-light-on-surface-variant hover:text-light-on-surface cursor-pointer">128px</button>
      </div>

      <button type="button" id="toggle-surface-btn" aria-pressed="false" class="min-h-[32px] px-gutter-sm py-1 rounded bg-light-surface-container-low text-light-on-surface border border-light-outline-variant hover:bg-light-surface-container font-label text-label-sm cursor-pointer">Surface: Light</button>
    </div>

    <!-- Stage -->
    <div id="loader-stage" class="w-full min-h-[240px] rounded-md border border-light-outline-variant bg-light-surface-container-low flex items-center justify-center p-gutter-xl transition-colors duration-state-change">
      <div id="universal-loader" class="fortis-loader" data-surface="light" role="status" aria-live="polite" aria-label="Loading" style="--loader-size: 64px;">
        <svg class="fortis-loader__mark" viewBox="0 0 361 378" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <g transform="translate(10 10)">
            <path class="fortis-loader__blade fortis-loader__blade--1" fill="var(--blade-primary)" d="M0 111 183 0l59 35L59 147v125L0 307z"></path>
            <path class="fortis-loader__blade fortis-loader__blade--2" fill="var(--blade-accent)" d="m99 177 183-111 59 35-183 112v124l-59-35z"></path>
            <path class="fortis-loader__blade fortis-loader__blade--3" fill="var(--blade-primary)" d="m158 237 101-61 59 35-101 61v96l-59-35z"></path>
          </g>
        </svg>
      </div>
    </div>

    <!-- Custom Size Slider -->
    <div class="flex items-center gap-gutter-md">
      <label for="size-slider" class="font-label text-label-sm text-light-on-surface-variant shrink-0">Size</label>
      <input id="size-slider" type="range" min="16" max="160" step="2" value="64" class="w-full accent-light-secondary cursor-pointer">
      <span id="size-readout" class="font-mono text-mono-sm text-light-on-surface tabular-nums w-12 text-right shrink-0">64px</span>
    </div>
  </div>

  <script>
    (function () {
      const loader = document.getElementById('universal-loader');
      const stage = document.getElementById('loader-stage');
      const slider = document.getElementById('size-slider');
      const readout = document.getElementById('size-readout');
      const presetBtns = document.querySelectorAll('.size-preset');
      const toggleSurfaceBtn = document.getElementById('toggle-surface-btn');

      let surface = 'light';

      function setSize(px) {
        const clamped = Math.max(16, Math.min(160, Number(px) || 64));
        loader.style.setProperty('--loader-size', clamped + 'px');
        slider.value = String(clamped);
        readout.textContent = clamped + 'px';

        presetBtns.forEach(btn => {
          const active = Number(btn.getAttribute('data-size')) === clamped;
          btn.className = 'size-preset px-2 py-1 rounded font-mono text-mono-sm cursor-pointer ' +
            (active ? 'bg-light-primary text-light-on-primary' : 'text-light-on-surface-variant hover:text-light-on-surface');
        });
      }

      presetBtns.forEach(btn => {
        btn.addEventListener('click', () => setSize(btn.getAttribute('data-size')));
      });

      slider.addEventListener('input', (e) => setSize(e.target.value));

      toggleSurfaceBtn.addEventListener('click', () => {
        surface = surface === 'light' ? 'dark' : 'light';
        loader.setAttribute('data-surface', surface);
        if (surface === 'dark') {
          stage.classList.remove('bg-light-surface-container-low');
          stage.classList.add('bg-fortis-navy');
          toggleSurfaceBtn.textContent = 'Surface: Dark';
          toggleSurfaceBtn.setAttribute('aria-pressed', 'true');
        } else {
          stage.classList.remove('bg-fortis-navy');
          stage.classList.add('bg-light-surface-container-low');
          toggleSurfaceBtn.textContent = 'Surface: Light';
          toggleSurfaceBtn.setAttribute('aria-pressed', 'false');
        }
      });
    })();
  </script>
