          <div data-component-id="input-field-text" data-component-type="input-field" data-component-variant="text" class="flex flex-col gap-1.5">
            <label for="business-id" data-design-text-token="label-md" class="font-label text-label-md text-light-on-surface">Business ID</label>
            <div class="relative flex items-center">
              <input id="business-id" name="business_id" type="password" autocomplete="off" spellcheck="false" placeholder="biz_01J9X4M2P8" class="w-full min-h-[44px] pl-gutter-md pr-11 py-gutter-sm rounded bg-light-surface-container-lowest text-light-on-surface font-mono text-mono-md border border-light-outline-variant placeholder:text-light-outline focus:border-light-primary focus:ring-1 focus:ring-light-primary transition-colors duration-state-change">
              <button type="button" data-toggle-for="business-id" aria-label="Show Business ID" class="absolute right-1.5 inline-flex items-center justify-center w-9 h-9 rounded text-light-on-surface-variant hover:text-light-primary hover:bg-light-surface-container-low focus-visible:outline focus-visible:outline-2 focus-visible:outline-light-primary transition-colors duration-state-change cursor-pointer">
                <span class="material-symbols-outlined text-[20px]" aria-hidden="true">visibility</span>
              </button>
            </div>
          </div>

          <!-- Branch ID -->
          <div data-component-id="input-field-text" data-component-type="input-field" data-component-variant="text" class="flex flex-col gap-1.5">
            <label for="branch-id" data-design-text-token="label-md" class="font-label text-label-md text-light-on-surface">Branch ID</label>
            <div class="relative flex items-center">
              <input id="branch-id" name="branch_id" type="password" autocomplete="off" spellcheck="false" placeholder="brn_04_downtown" class="w-full min-h-[44px] pl-gutter-md pr-11 py-gutter-sm rounded bg-light-surface-container-lowest text-light-on-surface font-mono text-mono-md border border-light-outline-variant placeholder:text-light-outline focus:border-light-primary focus:ring-1 focus:ring-light-primary transition-colors duration-state-change">
              <button type="button" data-toggle-for="branch-id" aria-label="Show Branch ID" class="absolute right-1.5 inline-flex items-center justify-center w-9 h-9 rounded text-light-on-surface-variant hover:text-light-primary hover:bg-light-surface-container-low focus-visible:outline focus-visible:outline-2 focus-visible:outline-light-primary transition-colors duration-state-change cursor-pointer">
                <span class="material-symbols-outlined text-[20px]" aria-hidden="true">visibility</span>
              </button>
            </div>
          </div>

          <!-- Primary Submit Action -->
          <div class="pt-gutter-sm">
            <!-- COMPONENT: button-primary -->
            <button id="submit-btn" data-component-id="button-primary" data-component-type="button" data-component-variant="primary" type="submit" class="w-full inline-flex items-center justify-center gap-gutter-sm min-h-[48px] px-gutter-lg py-gutter-sm rounded bg-light-primary text-light-on-primary hover:opacity-90 active:scale-[0.99] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-light-primary transition-all duration-state-change ease-state-change cursor-pointer">
              <span id="submit-label" data-design-text-token="label-lg" class="font-label text-label-lg">Activate terminal</span>
            </button>
          </div>
        </form>
      </article>
    </main>

    <!-- Quiet persistent system status footer -->
    <footer class="w-full px-gutter-xl py-gutter-md border-t border-light-outline-variant bg-light-surface-container-low flex items-center justify-between">
      <div class="flex items-center text-light-on-surface-variant">
        <span class="inline-flex items-center gap-1.5">
          <span class="material-symbols-outlined text-[16px] text-light-secondary" aria-hidden="true">cloud_done</span>
          <span data-design-text-token="mono-sm" class="font-mono text-mono-sm">System: Online</span>
        </span>
      </div>
    </footer>
  </div>

  <script>
    const form = document.getElementById('activation-form');
    const codeInput = document.getElementById('terminal-code');
    const bizInput = document.getElementById('business-id');
    const branchInput = document.getElementById('branch-id');
    const banner = document.getElementById('status-banner');
    const statusIcon = document.getElementById('status-icon');
    const statusTitle = document.getElementById('status-title');
    const statusCode = document.getElementById('status-code');
    const statusMessage = document.getElementById('status-message');
    const submitBtn = document.getElementById('submit-btn');
    const submitLabel = document.getElementById('submit-label');

    function resetInputBorders() {
      [codeInput, bizInput, branchInput].forEach((el) => {
        el.removeAttribute('aria-invalid');
        el.classList.remove('border-light-error', 'focus:border-light-error', 'focus:ring-light-error');
        el.classList.add('border-light-outline-variant', 'focus:border-light-primary', 'focus:ring-light-primary');
      });
    }

    function markInvalid(inputs) {
      inputs.forEach((el) => {
        el.setAttribute('aria-invalid', 'true');
        el.classList.remove('border-light-outline-variant', 'focus:border-light-primary', 'focus:ring-light-primary');
        el.classList.add('border-light-error', 'focus:border-light-error', 'focus:ring-light-error');
      });
    }

    function showBanner(kind, codeText, titleText, bodyText) {
      banner.className = 'rounded-md p-gutter-md border flex items-start gap-gutter-sm';
      if (kind === 'error') {
        banner.classList.add('bg-light-error-container', 'text-light-on-error-container', 'border-light-error');
        statusIcon.textContent = 'error';
        statusCode.className = 'font-mono text-mono-sm px-2 py-0.5 rounded-sm tabular-nums bg-light-error text-light-on-error';
      } else if (kind === 'warning') {
        banner.classList.add('bg-light-warning-container', 'text-light-on-warning-container', 'border-light-warning');
        statusIcon.textContent = 'warning';
        statusCode.className = 'font-mono text-mono-sm px-2 py-0.5 rounded-sm tabular-nums bg-light-warning text-light-on-warning';
      } else {
        banner.classList.add('bg-light-success-container', 'text-light-on-success-container', 'border-light-success');
        statusIcon.textContent = 'check_circle';
        statusCode.className = 'font-mono text-mono-sm px-2 py-0.5 rounded-sm tabular-nums bg-light-success text-light-on-success';
      }
      statusCode.textContent = codeText;
      statusTitle.textContent = titleText;
      statusMessage.textContent = bodyText;
    }

    function applyPreviewState(state) {
      resetInputBorders();
      submitBtn.disabled = false;
      submitBtn.classList.remove('opacity-70', 'cursor-not-allowed');
      submitLabel.textContent = 'Activate terminal';

      if (state === 'default') {
        banner.className = 'hidden';
        codeInput.value = '';
        bizInput.value = '';
        branchInput.value = '';
        return;
      }

      if (!codeInput.value) codeInput.value = 'FRT-8492-KLMN';
      if (!bizInput.value) bizInput.value = 'biz_01J9X4M2P8';
      if (!branchInput.value) branchInput.value = 'brn_04_downtown';

      if (state === '404') {
        markInvalid([codeInput, bizInput, branchInput]);
        showBanner(
          'error',
          '404 Not Found',
          'Unknown business, branch, or activation code',
          'No inactive terminal matched those details. Verify the emailed code (case-insensitive), Business ID, and Branch ID, then try again.'
        );
      } else if (state === '409') {
        markInvalid([codeInput]);
        showBanner(
          'warning',
          '409 Conflict',
          'Terminal cannot be activated',
          'This terminal is suspended or decommissioned and cannot be activated. Contact your store administrator to issue a new terminal.'
        );
      } else if (state === '200') {
        showBanner(
          'success',
          '200 Active',
          'Terminal activated and audited',
          'Register linked to brn_04_downtown. Subsequent launches will open directly to the workspace.'
        );
        submitLabel.textContent = 'Continue to workspace';
      }
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      resetInputBorders();

      const code = codeInput.value.trim();
      const biz = bizInput.value.trim();
      const branch = branchInput.value.trim();

      const missing = [];
      if (!code) missing.push(codeInput);
      if (!biz) missing.push(bizInput);
      if (!branch) missing.push(branchInput);

      if (missing.length > 0) {
        markInvalid(missing);
        showBanner(
          'error',
          'Required',
          'Complete all registration fields',
          'Enter the terminal activation code, Business ID, and Branch ID before sending.'
        );
        return;
      }

      const normalized = code.toLowerCase();
      if (normalized.includes('404')) {
        applyPreviewState('404');
      } else if (normalized.includes('409')) {
        applyPreviewState('409');
      } else {
        applyPreviewState('200');
      }
    });

    document.querySelectorAll('[data-toggle-for]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const input = document.getElementById(btn.getAttribute('data-toggle-for'));
        const icon = btn.querySelector('.material-symbols-outlined');
        if (!input || !icon) return;
        const hidden = input.type === 'password';
        input.type = hidden ? 'text' : 'password';
        icon.textContent = hidden ? 'visibility_off' : 'visibility';
      });
    });
  </script>


</body></html>
