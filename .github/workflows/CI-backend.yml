name: Continuous Integration

on:
  pull_request:
    branches: ["**"]

jobs:
  # Security scanning
  security:
    name: 🔒 Security Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: |
          cd backend
          npm ci

      - name: Run security audit
        run: |
          cd backend
          npm audit --audit-level high || echo "Security audit warnings found, continuing..."

      - name: Run secret scanning
        uses: trufflesecurity/trufflehog@v3.99.8
        if: github.event_name == 'pull_request'
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified
          version: 3.99.8

  # Code quality checks
  code-quality:
    name: 🧹 Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: |
          cd backend
          npm ci

      - name: Run linter
        run: |
          cd backend
          npm run lint

      - name: Check formatting
        run: |
          cd backend
          npm run format:check

      - name: Run type checking
        run: |
          cd backend
          npx tsc --noEmit

  # Dependency auditing
  dependency-audit:
    name: 📦 Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: |
          cd backend
          npm ci

      - name: Run npm audit
        run: |
          cd backend
          npm audit || echo "npm audit warnings found, continuing..."

  # Unit tests with coverage
  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: |
          cd backend
          npm ci

      - name: Run unit tests with coverage
        run: |
          cd backend
          npm run test:cov
        env:
          NODE_OPTIONS: --experimental-vm-modules

  # Integration tests with databases
  integration-tests:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: |
          cd backend
          npm ci

      - name: Run integration tests
        run: |
          cd backend
          npm run test
        env:
          NODE_OPTIONS: --experimental-vm-modules
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_secret_at_least_32_characters_long_for_testing_purposes_only

  # E2E tests
  e2e-tests:
    name: 🌐 E2E Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: |
          cd backend
          npm ci

      - name: Run E2E tests
        run: |
          cd backend
          npm run test:e2e
        env:
          NODE_OPTIONS: --experimental-vm-modules
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_secret_at_least_32_characters_long_for_testing_purposes_only

  # Matrix testing across Node.js versions
  matrix-testing:
    name: ⚙️ Matrix Testing
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: |
          cd backend
          npm ci

      - name: Run unit tests
        run: |
          cd backend
          npm run test
        env:
          NODE_OPTIONS: --experimental-vm-modules

  # Build verification
  build-verification:
    name: 🏗️ Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: |
          cd backend
          npm ci

      - name: Run production build
        run: |
          cd backend
          npm run build

      - name: Cache build artifacts
        uses: actions/cache@v5
        with:
          path: backend/dist
          key: ${{ runner.os }}-build-${{ hashFiles('backend/**/*.ts') }}

  # Pull Request automation
  pr-automation:
    name: 🤖 PR Automation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      issues: write
      pull-requests: write
    needs: [security, code-quality, dependency-audit, unit-tests, integration-tests, e2e-tests, matrix-testing, build-verification]
    steps:
      - name: Add PR labels
        uses: actions/github-script@v9
        with:
          script: |
            const statuses = ${{ toJSON(needs) }};
            const labels = [];

            // Check if all jobs passed
            const allPassed = Object.values(statuses).every(job => job.result === 'success');

            if (allPassed) {
              labels.push('status: ready-to-merge');
            } else {
              labels.push('status: needs-work');
            }

            // Add labels based on job results
            Object.entries(statuses).forEach(([job, result]) => {
              if (result.result !== 'success') {
                labels.push(`failed: ${job}`);
              }
            });

            github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: labels
            });

      - name: Comment on PR with status
        uses: actions/github-script@v9
        with:
          script: |
            const statuses = ${{ toJSON(needs) }};
            let comment = "## 🚀 CI Pipeline Results\n\n";

            comment += "| Job | Status |\n";
            comment += "|-----|--------|\n";

            Object.entries(statuses).forEach(([job, result]) => {
              const statusEmoji = result.result === 'success' ? '✅' : '❌';
              comment += `| ${job} | ${statusEmoji} ${result.result} |\n`;
            });

            comment += "\n<details>\n<summary>Details</summary>\n\n";
            comment += "All checks have completed. Review the results above.\n";
            comment += "</details>";

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # Configure this stable check as required in the repository ruleset.
  backend-ci-required:
    name: Backend CI Required
    runs-on: ubuntu-latest
    if: always()
    needs:
      - security
      - code-quality
      - dependency-audit
      - unit-tests
      - integration-tests
      - e2e-tests
      - matrix-testing
      - build-verification
    steps:
      - name: Verify all CI jobs passed
        if: >-
          always() &&
          needs.security.result == 'success' &&
          needs.code-quality.result == 'success' &&
          needs.dependency-audit.result == 'success' &&
          needs.unit-tests.result == 'success' &&
          needs.integration-tests.result == 'success' &&
          needs.e2e-tests.result == 'success' &&
          needs.matrix-testing.result == 'success' &&
          needs.build-verification.result == 'success'
        run: echo "All backend CI jobs passed."

      - name: Fail when any CI job did not pass
        if: >-
          always() &&
          (needs.security.result != 'success' ||
          needs.code-quality.result != 'success' ||
          needs.dependency-audit.result != 'success' ||
          needs.unit-tests.result != 'success' ||
          needs.integration-tests.result != 'success' ||
          needs.e2e-tests.result != 'success' ||
          needs.matrix-testing.result != 'success' ||
          needs.build-verification.result != 'success')
        run: |
          echo "One or more backend CI jobs failed, were cancelled, or were skipped."
          exit 1
